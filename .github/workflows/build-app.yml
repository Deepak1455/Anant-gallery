name: Generate Android AAB & APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🚀 Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: ⚙️ Fix Android SDK Structure & Configure Bubblewrap
        run: |
          # 1. Android SDK के cmdline-tools को 'latest' सिम्लिंक से जोड़ें (Bubblewrap की अनिवार्य शर्त)
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            LATEST_DIR=$(find "$ANDROID_HOME/cmdline-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
            if [ -n "$LATEST_DIR" ]; then
              ln -s "$LATEST_DIR" "$ANDROID_HOME/cmdline-tools/latest"
            fi
          fi

          # 2. सभी Android SDK लाइसेंस स्वतः स्वीकार करें
          yes | sdkmanager --licenses || true

          # 3. Bubblewrap को सही Java 17 और Android SDK पाथ दें
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          echo "✅ Bubblewrap Configured Successfully!"

      - name: 🔨 Build Signed Android AAB & APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "androidpassword"
          BUBBLEWRAP_KEY_PASSWORD: "androidpassword"
        run: |
          # 1. यदि twa-app फोल्डर है तो उसमें जाएं
          if [ -d "twa-app" ]; then
            cd twa-app
          fi

          # 2. build.gradle से गलत 'generatorApp' लाइन को हटाएं
          if [ -f "app/build.gradle" ]; then
            echo "Removing generatorApp line from build.gradle..."
            sed -i '/generatorApp/d' app/build.gradle
          fi

          # 3. यदि keystore मौजूद नहीं है तो ऑटोमैटिक release keystore बनाएं (ताकि पासवर्ड प्रॉम्प्ट न आए)
          if [ ! -f "android.keystore" ]; then
            echo "Creating signing keystore..."
            keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass androidpassword -keypass androidpassword -dname "CN=AnantGallery, OU=Mobile, O=Anant, L=Delhi, S=Delhi, C=IN"
          fi

          # 4. Bubblewrap Build बिना किसी प्रॉम्प्ट या सवाल के चलाएं
          bubblewrap build --skipPwaValidation

      - name: 📦 Upload Official AAB & APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Anant-Gallery-Android-Build
          path: |
            **/build/outputs/bundle/release/*.aab
            **/build/outputs/apk/release/*.apk
            **/*.aab
            **/*.apk
          retention-days: 14
