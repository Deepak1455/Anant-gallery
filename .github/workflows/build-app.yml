name: Generate Android AAB & APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🚀 Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: ⚙️ Generate Project & Build AAB
        run: |
          # 1. अगर twa-manifest.json है तो प्रोजेक्ट अपडेट करें या बिल्ड करें
          if [ -d "twa-app" ]; then
            cd twa-app
          fi
          
          # 🌟 CRITICAL FIX: build.gradle से खराब 'generatorApp' लाइन को ऑटो-रिमूव करें
          if [ -f "app/build.gradle" ]; then
            echo "Fixing build.gradle syntax error..."
            sed -i '/generatorApp/d' app/build.gradle
          fi

          # 2. Bubblewrap build चलाएं
          bubblewrap build || ./gradlew bundleRelease assembleRelease

      - name: 📦 Upload Official AAB & APK
        uses: actions/upload-artifact@v4
        with:
          name: Anant-Gallery-Android-Build
          path: |
            **/build/outputs/bundle/release/*.aab
            **/build/outputs/apk/release/*.apk
          retention-days: 14 
