name: Generate Android AAB & APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🚀 Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: ⚙️ Generate Project & Build AAB
        run: |
          # 1. यदि twa-app फोल्डर है तो उसमें जाएं
          if [ -d "twa-app" ]; then
            cd twa-app
          fi

          # 2. Bubblewrap update चलाएं
          bubblewrap update --skipPwaValidation || true

          # 🌟 3. लाइन 45 वाले 'generatorApp' एरर को जड़ से ठीक करें
          if [ -f "app/build.gradle" ]; then
            echo "Removing invalid generatorApp line from build.gradle..."
            sed -i '/generatorApp/d' app/build.gradle
          fi

          # 4. AAB और APK बिल्ड करें
          bubblewrap build --skipPwaValidation || ./gradlew bundleRelease assembleRelease

      - name: 📦 Upload Official AAB & APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Anant-Gallery-Build
          path: |
            **/build/outputs/bundle/release/*.aab
            **/build/outputs/apk/release/*.apk
          retention-days: 14 
