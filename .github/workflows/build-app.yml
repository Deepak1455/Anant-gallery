name: Generate Android AAB & APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🚀 Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: ⚙️ Pre-Config Bubblewrap & Fix Line 45 Error
        run: |
          # 1. Bubblewrap को Java 17 और Android SDK का रास्ता दें ताकि सवाल न पूछे
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

          # 2. twa-app फोल्डर में जाएं
          if [ -d "twa-app" ]; then
            cd twa-app
          fi

          # 3. Line 45 वाले 'generatorApp' सिंटैक्स एरर को जड़ से हटाएं
          if [ -f "app/build.gradle" ]; then
            echo "Removing generatorApp line from build.gradle..."
            sed -i '/generatorApp/d' app/build.gradle
          fi

          # 4. Bubblewrap Build बिना किसी सवाल के चलाएं
          yes "" | bubblewrap build --skipPwaValidation

      - name: 📦 Upload Official AAB & APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Anant-Gallery-Android-Build
          path: |
            **/build/outputs/bundle/release/*.aab
            **/build/outputs/apk/release/*.apk
            **/*.aab
            **/*.apk
          retention-days: 14
