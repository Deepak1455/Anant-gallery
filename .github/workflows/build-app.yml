name: Generate Android AAB & APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔑 Setup Keystore & twa-manifest
        run: |
          # 1. Keystore बनाएं
          if [ ! -f "android.keystore" ]; then
            echo "Creating permanent signing keystore..."
            keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass androidpassword -keypass androidpassword -dname "CN=AnantGallery, OU=Mobile, O=Anant, L=Delhi, ST=Delhi, C=IN"
          fi

          # 2. twa-manifest.json तैयार करें (रिलेटिव /share-target के साथ)
          cat <<EOF > twa-manifest.json
          {
            "packageId": "app.vercel.anantgallery.twa",
            "host": "anant-gallery.vercel.app",
            "name": "Anant Gallery",
            "launcherName": "Anant Gallery",
            "display": "standalone",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "backgroundColor": "#090d16",
            "enableNotifications": true,
            "startUrl": "/?source=pwa",
            "iconUrl": "https://raw.githubusercontent.com/Deepak1455/Anant-gallery/main/icon-512.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/Deepak1455/Anant-gallery/main/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "generatorApp": "bubblewrap-cli",
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "splashScreenFadeOutDuration": 300,
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "fullScopeUrl": "https://anant-gallery.vercel.app/",
            "minSdkVersion": 21,
            "orientation": "portrait",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "webShareTarget": {
              "action": "/share-target",
              "method": "POST",
              "enctype": "multipart/form-data",
              "params": {
                "title": "title",
                "text": "text",
                "files": [
                  {
                    "name": "photos",
                    "accept": ["image/*"]
                  }
                ]
              }
            },
            "features": {},
            "alphaDependencies": {
              "enabled": false
            }
          }
          EOF

      - name: 🛠️ Generate Android Project
        run: |
          npm install @bubblewrap/core
          node -e "
          const { TwaGenerator, TwaManifest } = require('@bubblewrap/core');
          async function buildProject() {
            const manifest = await TwaManifest.fromFile('./twa-manifest.json');
            const generator = new TwaGenerator();
            if (typeof generator.createTwaProject === 'function') {
              await generator.createTwaProject('./', manifest);
            } else if (typeof generator.create === 'function') {
              await generator.create('./', manifest);
            }
            console.log('🎉 Project Generated!');
          }
          buildProject().catch(e => { console.error(e); process.exit(1); });
          "

      - name: 📱 Smart Share Target & AutoVerify URL Bar Removal
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "androidpassword"
          BUBBLEWRAP_KEY_PASSWORD: "androidpassword"
        run: |
          # 1. strings.xml में generatorApp स्ट्रिंग डालें
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i 's|</resources>|    <string name="generatorApp">bubblewrap</string>\n</resources>|' app/src/main/res/values/strings.xml
          fi

          # 2. रिलेटिव share_target.xml (Android TWA के आधिकारिक नियम अनुसार)
          mkdir -p app/src/main/res/xml
          cat <<'EOF' > app/src/main/res/xml/share_target.xml
          <?xml version="1.0" encoding="utf-8"?>
          <share-target
              xmlns:android="http://schemas.android.com/apk/res/android"
              action="/share-target"
              method="POST"
              enctype="multipart/form-data">
              <data name="photos" />
          </share-target>
          EOF

          # 3. AndroidManifest में singleTask, autoVerify और 1-क्लिक शेयर इंटेंट सेट करें
          python3 -c "
          import re
          path = 'app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              manifest = f.read()

          # URL बार हटाने के लिए autoVerify जोड़े
          manifest = manifest.replace('<intent-filter>', '<intent-filter android:autoVerify=\"true\">')

          # सिंगल टास्क सेट करें
          manifest = re.sub(r'android:launchMode=\"[^\"]*\"', 'android:launchMode=\"singleTask\"', manifest)
          if 'android:launchMode' not in manifest:
              manifest = re.sub(r'(<activity[^>]*android:name=\"[^\"]*LauncherActivity\"[^>]*)', r'\1 android:launchMode=\"singleTask\"', manifest)

          # शेयर इंटेंट जोड़ें
          share_block = '''
                  <intent-filter>
                      <action android:name=\"android.intent.action.SEND\" />
                      <action android:name=\"android.intent.action.SEND_MULTIPLE\" />
                      <category android:name=\"android.intent.category.DEFAULT\" />
                      <data android:mimeType=\"image/*\" />
                  </intent-filter>
                  <meta-data
                      android:name=\"android.support.customtabs.trusted.METADATA_SHARE_TARGET\"
                      android:resource=\"@xml/share_target\" />
          '''

          manifest = re.sub(r'<intent-filter>\s*<action android:name=\"android.intent.action.SEND\".*?</intent-filter>', '', manifest, flags=re.DOTALL)
          manifest = re.sub(r'<meta-data\s+android:name=\"android.support.customtabs.trusted.METADATA_SHARE_TARGET\".*?/>', '', manifest, flags=re.DOTALL)
          manifest = re.sub(r'(<activity[^>]*android:name=\"[^\"]*LauncherActivity\"[^>]*>)', r'\1' + share_block, manifest)

          with open(path, 'w') as f:
              f.write(manifest)
          print('✅ Smart Share Target & AutoVerify Configured!')
          "

          # 4. Gradle से AAB और APK बनाएं
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

          # 5. apksigner से v2+v3 साइन करें
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/aligned.apk
            $BUILD_TOOLS/apksigner sign --ks android.keystore --ks-pass pass:androidpassword --key-pass pass:androidpassword --out app/build/outputs/apk/release/anant-gallery-signed.apk app/build/outputs/apk/release/aligned.apk
            echo "✅ Signed APK Ready!"
          fi

      - name: 📦 Upload Official AAB & Signed APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Anant-Gallery-Android-Build
          path: |
            **/build/outputs/bundle/release/*.aab
            **/build/outputs/apk/release/anant-gallery-signed.apk
            **/*.aab
          retention-days: 14
