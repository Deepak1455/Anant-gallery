name: Build Google Official AAB & APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🚀 Install Google Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: ⚙️ Auto-Config Bubblewrap & Build AAB
        run: |
          # 1. Bubblewrap को पहले ही बता दें कि JDK और Android SDK कहाँ है (ताकि कोई सवाल न पूछे)
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

          mkdir -p twa-build
          cd twa-build

          # 2. सुरक्षित डिजिटल Keystore बनाएँ
          keytool -genkey -v -keystore android.keystore -alias anant-key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass AnantPass2026 -keypass AnantPass2026 \
            -dname "CN=Anant Admin, O=Anant Gallery, C=IN"

          # 3. 100% सही Google Play TWA कॉन्फ़िगरेशन (फ़ोटो शेयरिंग और सिंगल-टास्क के साथ)
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "app.vercel.anant_gallery.twa",
            "host": "anant-gallery.vercel.app",
            "name": "Anant Gallery - Infinite Cloud Storage",
            "launcherName": "Anant Gallery",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "backgroundColor": "#090d16",
            "enableNotifications": true,
            "startUrl": "/?source=pwa",
            "iconUrl": "https://anant-gallery.vercel.app/icon-512.png",
            "maskableIconUrl": "https://anant-gallery.vercel.app/icon-512.png",
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "display": "standalone",
            "orientation": "portrait",
            "shortcuts": [],
            "webShareTarget": {
              "action": "/share-target",
              "method": "POST",
              "enctype": "multipart/form-data",
              "params": {
                "title": "title",
                "text": "text",
                "files": [
                  {
                    "name": "photos",
                    "accept": ["image/*"]
                  }
                ]
              }
            },
            "signing": {
              "keyStore": "android.keystore",
              "keyAlias": "anant-key"
            }
          }
          EOF

          # 4. पासवर्ड ऑटो-सेट करें ताकि बिल्ड न रुके
          export BUBBLEWRAP_KEYSTORE_PASSWORD="AnantPass2026"
          export BUBBLEWRAP_KEY_PASSWORD="AnantPass2026"

          # 5. शुद्ध Google AAB और APK जनरेट करें
          bubblewrap build --skipPwaValidation

      - name: 📤 Upload Google Play Files
        uses: actions/upload-artifact@v4
        with:
          name: Anant-Gallery-Google-Official-Build
          path: |
            twa-build/app-release-bundle.aab
            twa-build/app-release-signed.apk
            twa-build/android.keystore
