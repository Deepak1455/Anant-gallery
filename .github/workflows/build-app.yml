name: Build Google Official AAB & APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🚀 Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: ⚙️ Generate Project & Build AAB
        run: |
          # 1. Bubblewrap config
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

          mkdir -p twa-app
          cd twa-app

          # 2. सुरक्षित Keystore बनाएँ
          keytool -genkeypair -dname "cn=Anant, ou=Engineering, o=AnantGallery, c=IN" \
            -alias anant-key -keypass AnantPass2026 -keystore android.keystore -storepass AnantPass2026 -validity 20000 -keyalg RSA

          # 3. सटीक TWA कॉन्फ़िगरेशन
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "app.vercel.anant_gallery.twa",
            "host": "anant-gallery.vercel.app",
            "name": "Anant Gallery - Infinite Cloud Storage",
            "launcherName": "Anant Gallery",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "backgroundColor": "#090d16",
            "enableNotifications": true,
            "startUrl": "/?source=pwa",
            "iconUrl": "https://anant-gallery.vercel.app/icon-512.png",
            "maskableIconUrl": "https://anant-gallery.vercel.app/icon-512.png",
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "appVersion": "1.0.0",
            "display": "standalone",
            "orientation": "portrait",
            "shortcuts": [],
            "webShareTarget": {
              "action": "/share-target",
              "method": "POST",
              "enctype": "multipart/form-data",
              "params": {
                "title": "title",
                "text": "text",
                "files": [
                  {
                    "name": "photos",
                    "accept": ["image/*"]
                  }
                ]
              }
            },
            "signing": {
              "keyStore": "android.keystore",
              "keyAlias": "anant-key"
            }
          }
          EOF

          # 4. 🌟 वर्ज़न सवाल बाईपास करें (--skipVersionCheck से कभी नहीं पूछेगा)
          printf '1.0.0\n1\n\n\n' | bubblewrap update --skipVersionCheck --skipPwaValidation || true

          # 5. 🌟 सिंगल-टास्क (डुप्लीकेट स्क्रीन हमेशा के लिए ख़त्म)
          sed -i 's|<activity|<activity android:launchMode="singleTask" android:taskAffinity=""|g' app/src/main/AndroidManifest.xml 2>/dev/null || true

          # 6. 🌟 सीधे Google Gradle इंजन से फ़ास्ट AAB और APK कंपाइल करें
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/android.keystore \
            -Pandroid.injected.signing.store.password=AnantPass2026 \
            -Pandroid.injected.signing.key.alias=anant-key \
            -Pandroid.injected.signing.key.password=AnantPass2026

      - name: 📤 Upload Official AAB & APK
        uses: actions/upload-artifact@v4
        with:
          name: Anant-Gallery-Google-Official-Build
          path: |
            twa-app/**/*.aab
            twa-app/**/*.apk
            twa-app/android.keystore
