name: Build Google Official AAB & APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🚀 Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: ⚙️ Build App Automatically
        run: |
          # 1. Bubblewrap के लिए JDK और SDK कॉन्फ़िगर करें (ताकि कोई सवाल न पूछे)
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

          mkdir -p twa-build
          cd twa-build

          # 2. सुरक्षित डिजिटल Keystore बनाएँ
          keytool -genkeypair -dname "cn=Anant, ou=Engineering, o=AnantGallery, c=IN" \
            -alias anant-key -keypass AnantPass2026 -keystore android.keystore -storepass AnantPass2026 -validity 20000 -keyalg RSA

          # 3. 🌟 Vercel से प्रोजेक्ट को बिना रुके ऑटो-इनिशियलाइज़ करें
          yes "" | bubblewrap init --manifest=https://anant-gallery.vercel.app/manifest.json --directory=. --skipPwaValidation || true

          # 4. Keystore को TWA से लिंक करें
          sed -i 's|"keyStore": ".*"|"keyStore": "android.keystore"|' twa-manifest.json 2>/dev/null || true
          sed -i 's|"keyAlias": ".*"|"keyAlias": "anant-key"|' twa-manifest.json 2>/dev/null || true

          # 5. 🌟 सिंगल-टास्क (डुप्लीकेट स्क्रीन हमेशा के लिए ख़त्म)
          sed -i 's|<activity|<activity android:launchMode="singleTask" android:taskAffinity=""|g' app/src/main/AndroidManifest.xml 2>/dev/null || true

          # 6. ऑटोमैटिक पासवर्ड फ़ीड करके शुद्ध AAB और APK बिल्ड करें
          export BUBBLEWRAP_KEYSTORE_PASSWORD="AnantPass2026"
          export BUBBLEWRAP_KEY_PASSWORD="AnantPass2026"

          yes "AnantPass2026" | bubblewrap build --skipPwaValidation

      - name: 📤 Upload Google Play Files
        uses: actions/upload-artifact@v4
        with:
          name: Anant-Gallery-Google-Official-Build
          path: |
            twa-build/*.aab
            twa-build/*.apk
            twa-build/*.keystore
