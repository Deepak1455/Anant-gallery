name: Generate Android AAB & APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🚀 Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: ⚙️ Fix Android SDK Structure & Configure Bubblewrap
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            LATEST_DIR=$(find "$ANDROID_HOME/cmdline-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
            if [ -n "$LATEST_DIR" ]; then
              ln -s "$LATEST_DIR" "$ANDROID_HOME/cmdline-tools/latest"
            fi
          fi

          yes | sdkmanager --licenses || true

          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          echo "✅ Bubblewrap Configured Successfully!"

      - name: 🔨 Generate twa-manifest & Build Signed AAB/APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "androidpassword"
          BUBBLEWRAP_KEY_PASSWORD: "androidpassword"
        run: |
          # 1. ऑटोमैटिक Signing Keystore बनाएं
          if [ ! -f "android.keystore" ]; then
            echo "Creating signing keystore..."
            keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass androidpassword -keypass androidpassword -dname "CN=AnantGallery, OU=Mobile, O=Anant, L=Delhi, ST=Delhi, C=IN"
          fi

          # 2. यदि twa-manifest.json मौजूद नहीं है, तो इसे ऑटोमैटिक बनाएं
          if [ ! -f "twa-manifest.json" ] && [ ! -f "twa-app/twa-manifest.json" ]; then
            echo "Generating twa-manifest.json automatically..."
            cat <<EOF > twa-manifest.json
          {
            "packageId": "app.vercel.anantgallery.twa",
            "host": "anant-gallery.vercel.app",
            "name": "Anant Gallery - Infinite Cloud Storage",
            "launcherName": "Anant",
            "display": "standalone",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "backgroundColor": "#090d16",
            "enableNotifications": true,
            "startUrl": "/?source=pwa",
            "iconUrl": "https://anant-gallery.vercel.app/icon-512.png",
            "maskableIconUrl": "https://anant-gallery.vercel.app/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "splashScreenFadeOutDuration": 300,
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "fullScopeUrl": "https://anant-gallery.vercel.app/",
            "minSdkVersion": 21,
            "orientation": "portrait",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "features": {},
            "alphaDependencies": {
              "enabled": false
            }
          }
          EOF
          fi

          # 3. यदि twa-app फोल्डर में फाइल है तो वहां जाएं
          if [ -d "twa-app" ]; then
            cd twa-app
          fi

          # 4. Android Project फाइल्स तैयार करें
          bubblewrap update --skipPwaValidation || true

          # 5. build.gradle से गलत generatorApp सिंटैक्स लाइन हटाएं
          if [ -f "app/build.gradle" ]; then
            sed -i '/generatorApp/d' app/build.gradle
          fi

          # 6. फाइनल AAB और APK बिल्ड करें
          bubblewrap build --skipPwaValidation

      - name: 📦 Upload Official AAB & APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Anant-Gallery-Android-Build
          path: |
            **/build/outputs/bundle/release/*.aab
            **/build/outputs/apk/release/*.apk
            **/*.aab
            **/*.apk
          retention-days: 14
