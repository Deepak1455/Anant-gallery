name: Generate Android AAB & APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🚀 Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: ⚙️ Auto-Config Bubblewrap & Fix Errors
        run: |
          # 1. Bubblewrap को पहले ही बता दें कि JDK और Android SDK कहाँ हैं (सवाल पूछना बंद)
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

          # 2. twa-app फोल्डर में जाएं
          if [ -d "twa-app" ]; then
            cd twa-app
          fi

          # 3. gradlew को executable permission दें
          if [ -f "gradlew" ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
          fi

          # 4. Line 45 वाले 'generatorApp' सिंटैक्स एरर को क्लीन करें
          if [ -f "app/build.gradle" ]; then
            echo "Fixing generatorApp error in app/build.gradle..."
            sed -i 's/.*generatorApp:.*/\/\/ generatorApp line removed/' app/build.gradle
          fi

          # 5. AAB & APK बिल्ड करें
          if [ -f "gradlew" ]; then
            ./gradlew bundleRelease assembleRelease
          else
            yes "" | bubblewrap build --skipPwaValidation
          fi

      - name: 📦 Upload Official AAB & APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Anant-Gallery-Android-Build
          path: |
            **/build/outputs/bundle/release/*.aab
            **/build/outputs/apk/release/*.apk
          retention-days: 14
